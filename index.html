<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPAC and FOG Validator</title>
<style>
:root{--blue:#00539f;--blued:#003d75;--yel:#ffd200;--bg:#f2f5f9;--card:#fff;--tx:#1b2430;--mut:#55606e;--bd:#cfd7e2;--ok:#16733a;--okb:#e5f4ea;--no:#b3261e;--nob:#fbeae8;--wn:#8a5a00;--wnb:#fff3d1}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:#fff;color:var(--tx);border-bottom:6px solid var(--yel);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
header div{max-width:760px;margin:0 auto;text-align:center}
h1{font-size:24px;margin:0;font-weight:700;color:var(--blue)}
.intro{margin:2px 0 0;color:var(--mut);font-size:15px}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.step{font-weight:700;font-size:16px;margin:0 0 8px;color:var(--blued)}
.tabs{display:flex;gap:10px}
.tab{flex:1;padding:14px 8px;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--blue);color:#fff}
.crit{color:var(--mut);font-size:15px;margin:10px 0 22px}
.drop{display:block;border:2px solid var(--bd);background:var(--card);border-radius:6px;padding:30px 16px;text-align:center;cursor:pointer;color:var(--mut)}
.drop.over{border-color:var(--blue);background:#eaf2fb}
.drop b{display:inline-block;background:var(--yel);color:#1b2430;padding:12px 22px;border-radius:6px;font-size:17px;margin-bottom:8px}
.drop input{display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;margin-top:18px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;border-bottom:1px solid var(--bd);flex-wrap:wrap;background:#f8fafc}
.fn{font-weight:700;word-break:break-all}
.badge{padding:5px 12px;border-radius:4px;font-weight:700;font-size:15px}
.badge.ok{background:var(--ok);color:#fff}.badge.fail{background:var(--no);color:#fff}.badge.warn{background:var(--yel);color:#1b2430}
.row{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.row.sub{padding-left:42px;background:#fbfcfd}
.ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none;margin-top:1px}
.ok .ic{background:var(--okb);color:var(--ok)}.fail .ic{background:var(--nob);color:var(--no)}.warn .ic{background:var(--wnb);color:var(--wn)}
.d{color:var(--mut);font-size:15px}
.rm{padding:14px;background:#f8fafc}
.rm textarea{width:100%;min-height:80px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--tx);font:inherit;font-size:15px;padding:10px;resize:vertical}
button.cp{margin-top:10px;padding:12px 20px;border:0;border-radius:6px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.note{font-size:15px;color:var(--mut);padding:14px}
.busy{padding:16px;color:var(--mut)}
</style></head>
<body>
<header><div>
<h1>SPAC and FOG Validator</h1>
<p class="intro">Check a form before you sign off on it. Your files stay on your computer.</p>
</div></header>
<main>
<p class="step">Step 1: Pick the form</p>
<div class="tabs"><button class="tab on" data-m="spac">SPAC</button><button class="tab" data-m="fog">FOG</button></div>
<p class="crit" id="crit"></p>
<p class="step">Step 2: Add your PDF</p>
<label class="drop" id="drop"><input type="file" id="f" accept="application/pdf" multiple><b>Choose PDF files</b><br>or drag and drop them here</label>
<div id="out"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js"></script>
<script>
const S=3, MON='jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec';
const DATE_RES=[
  new RegExp('\\b(?:'+MON+')[a-z]*\\.?\\s+\\d{1,2},?\\s+\\d{2,4}\\b','i'),
  new RegExp('\\b\\d{1,2}\\s*[-/ ]?\\s*(?:'+MON+')[a-z]*\\.?\\s*[-/, ]?\\s*\\d{2,4}\\b','i'),
  /\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}\b/
];
const CFG={
  spac:{t:'SPAC',form:/Station Performance Assessment Checklist|QSF\/AS083/i,date:true,
    crit:'We check the Date, the Revision Date, and 3 signatures: Checklist Completed by, Noted by, Acknowledged by.',
    roles:[['Checklist Completed by',/checklist\s+completed\s+by/i],['Noted by',/noted\s+by/i],['Acknowledged by',/acknowledged\s+by/i]]},
  fog:{t:'FOG',form:/FEET.?ON.?GROUND|QSF\/AS088/i,date:false,
    crit:'We check the Revision Date and 2 signatures: Prepared by, Noted by.',
    roles:[['Prepared by',/prepared\s+by/i],['Noted by',/noted\s+by/i]]}
};
let mode='spac', ocrDead=false, ocrUsed=false, W=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const findDate=s=>{for(const r of DATE_RES){const m=s.match(r);if(m)return m[0].trim()}return null};
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function ocr(cv){
  if(ocrDead||!window.Tesseract)return null;
  try{
    ocrUsed=true;
    W=W||Tesseract.createWorker('eng');
    const w=await Promise.race([W,new Promise((_,j)=>setTimeout(()=>j('t'),30000))]);
    const r=await Promise.race([w.recognize(cv),new Promise((_,j)=>setTimeout(()=>j('t'),45000))]);
    return r.data;
  }catch(e){ocrDead=true;return null}
}
async function render(p){
  if(p.cv)return;
  const cv=document.createElement('canvas');cv.width=Math.ceil(p.vp.width);cv.height=Math.ceil(p.vp.height);
  await p.page.render({canvasContext:cv.getContext('2d',{willReadFrequently:true}),viewport:p.vp}).promise;
  p.cv=cv;
}
function linesOf(boxes){
  const rows=[];
  for(const b of [...boxes].sort((a,c)=>a.base-c.base||a.x-c.x)){
    const r=rows.find(r=>Math.abs(r.y-b.base)<b.h*0.6);
    r?r.items.push(b):rows.push({y:b.base,items:[b]});
  }
  return rows.sort((a,c)=>a.y-c.y).map(r=>r.items.sort((a,c)=>a.x-c.x).map(i=>i.str).join(' '));
}
function nameOf(s){
  for(const r of DATE_RES)s=s.replace(new RegExp(r.source,'gi'),' ');
  s=s.replace(/\b(signature|over|printed|name|date|and|by|noted|prepared|acknowledged|completed|checklist)\b/ig,' ').replace(/[^A-Za-z.' -]/g,' ');
  const t=s.split(/\s+/).filter(w=>w.replace(/[^A-Za-z]/g,'').length>=2);
  return t.length>=2?t.join(' '):null;
}
function dateCheck(lines){
  for(const l of lines){const m=l.match(/date\s*\/\s*time\s*:?/i);if(m){const d=findDate(l.slice(m.index+m[0].length));if(d)return d}}
  return null;
}
function revCheck(lines){
  let seen=false;
  for(const l of lines){const m=l.match(/rev\.?\s*date\s*:?/i);if(m){seen=true;const d=findDate(l.slice(m.index+m[0].length));if(d)return{d}}}
  return{d:null,seen};
}
async function signatories(cfg,pages){
  for(const p of pages){p.labels=[];for(const b of p.boxes)for(const [,re] of cfg.roles)if(re.test(b.str)){p.labels.push(b);break}}
  const out=[];
  for(const [label,re] of cfg.roles){
    let hit=null;
    for(const p of pages)for(const b of p.boxes)if(re.test(b.str))hit={p,b};
    if(!hit){out.push({label,status:'fail',msg:'The “'+label+'” block was not found on the form.'});continue}
    const {p,b}=hit,Wd=p.vp.width,Ht=p.vp.height;
    const x0=Math.max(0,b.x-0.12*Wd),x1=Math.min(Wd,x0+0.4*Wd);
    let y0=Math.max(0,b.y-0.02*Ht),y1=Math.min(Ht,b.y+0.11*Ht);
    for(const l of p.labels)if(l!==b&&l.y>b.y+b.h&&l.x<x1&&l.x+l.w>x0)y1=Math.min(y1,l.y-2);
    const inside=p.boxes.filter(q=>q!==b&&q.x+q.w/2>=x0&&q.x+q.w/2<=x1&&q.y+q.h/2>=y0&&q.y+q.h/2<=y1);
    let name=nameOf(inside.map(q=>q.str).join(' ')),src=name?'text':null;
    await render(p);
    const w=Math.max(1,Math.round(x1-x0)),h=Math.max(1,Math.round(y1-y0));
    const d=p.cv.getContext('2d').getImageData(Math.round(x0),Math.round(y0),w,h).data;
    const m=new Uint8Array(w*h);
    for(let i=0;i<w*h;i++)m[i]=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])<150?1:0;
    for(const q of p.boxes){
      const px=Math.floor(q.x-x0-3),py=Math.floor(q.y-y0-0.25*q.h),pw=Math.ceil(q.w+6),ph=Math.ceil(q.h*1.6);
      for(let y=Math.max(0,py);y<Math.min(h,py+ph);y++)for(let x=Math.max(0,px);x<Math.min(w,px+pw);x++)m[y*w+x]=0;
    }
    let ink=0;
    for(let y=0;y<h;y++){let c=0;for(let x=0;x<w;x++)c+=m[y*w+x];if(c>0.5*w)for(let x=0;x<w;x++)m[y*w+x]=0;}
    for(let i=0;i<w*h;i++)ink+=m[i];
    const sig=ink>=200;
    if(!name){
      const c2=document.createElement('canvas');c2.width=Math.round(w*1.5);c2.height=Math.round(h*1.5);
      const g=c2.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c2.width,c2.height);
      g.drawImage(p.cv,Math.round(x0),Math.round(y0),w,h,0,0,c2.width,c2.height);
      const r=await ocr(c2);
      if(r&&r.words){const n=nameOf(r.words.filter(x=>x.confidence>=55&&/[A-Za-z]{2,}/.test(x.text)).map(x=>x.text).join(' '));if(n){name=n;src='image (OCR)'}}
    }
    if(name&&sig)out.push({label,status:'ok',msg:name+', signed.'});
    else if(name)out.push({label,status:'fail',msg:name+' is printed but no signature was found.'});
    else if(sig)out.push({label,status:'warn',msg:ocrDead?'A signature is there, but the name is a picture and could not be read automatically. Please check it yourself.':'A signature is there, but the name could not be read. Please check it yourself.'});
    else out.push({label,status:'fail',msg:'No name and no signature found.'});
  }
  return out;
}
async function analyze(file,cfg){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i),vp=page.getViewport({scale:S}),tc=await page.getTextContent(),boxes=[];
    for(const it of tc.items){
      if(!it.str||!it.str.trim())continue;
      const [vx,vy]=vp.convertToViewportPoint(it.transform[4],it.transform[5]);
      const h=Math.max(Math.abs(it.transform[3]),it.height||0)*S;
      boxes.push({x:vx,base:vy,y:vy-h,w:it.width*S,h,str:it.str});
    }
    pages.push({page,vp,boxes,cv:null});
  }
  for(const p of pages)if(p.boxes.length<15){
    await render(p);const r=await ocr(p.cv);
    if(r&&r.words)p.boxes=r.words.filter(w=>w.text.trim()).map(w=>({x:w.bbox.x0,y:w.bbox.y0,w:w.bbox.x1-w.bbox.x0,h:w.bbox.y1-w.bbox.y0,base:w.bbox.y1,str:w.text}));
  }
  const lines=pages.flatMap(p=>linesOf(p.boxes));
  const all=lines.join('\n');
  if(!cfg.form.test(all)){
    const other=Object.values(CFG).find(c=>c!==cfg&&c.form.test(all));
    return{wrong:other?'This looks like a '+other.t+' form. Please switch to the '+other.t+' tab above.':'This does not look like a '+cfg.t+' form.'};
  }
  const rows=[];
  if(cfg.date){const d=dateCheck(lines);rows.push({label:'Date',status:d?'ok':'fail',msg:d?'Found: '+d:'No date found next to “Date / Time” in the header.'})}
  const r=revCheck(lines);
  rows.push({label:'Revision Date',status:r.d?'ok':'fail',msg:r.d?'Found: '+r.d:(r.seen?'The Rev. Date field is empty.':'No Rev. No / Rev. Date field found.')});
  const sg=await signatories(cfg,pages);
  return{rows,sg};
}
function worst(a){return a.includes('fail')?'fail':a.includes('warn')?'warn':'ok'}
function buildRemark(cfg,res){
  const sgS=worst(res.sg.map(s=>s.status)),all=worst([...res.rows.map(r=>r.status),sgS]);
  const issues=[...res.rows,...res.sg.map(s=>({label:'Signatory '+s.label,status:s.status,msg:s.msg}))].filter(x=>x.status!=='ok').map(x=>x.label+': '+x.msg);
  const head=cfg.t+' validation: '+(all==='ok'?'PASSED':all==='warn'?'NEEDS REVIEW':'FAILED')+'.';
  if(all==='ok')return head+' '+res.rows.map(r=>r.label+' '+r.msg.replace('Found: ','')).join('; ')+'; all '+res.sg.length+' signatories complete.';
  return head+' '+issues.join(' ');
}
const IC={ok:'✓',fail:'✗',warn:'!'};
const rowH=(r,sub)=>'<div class="row '+r.status+(sub?' sub':'')+'"><span class="ic">'+IC[r.status]+'</span><div><b>'+esc(r.label)+'</b><div class="d">'+esc(r.msg)+'</div></div></div>';
function card(file,cfg,res){
  if(res.wrong)return '<div class="card"><div class="hd"><span class="fn">'+esc(file.name)+'</span><span class="badge warn">Wrong form</span></div><div class="note">'+esc(res.wrong)+'</div></div>';
  const sgS=worst(res.sg.map(s=>s.status)),all=worst([...res.rows.map(r=>r.status),sgS]);
  const rem=buildRemark(cfg,res);
  return '<div class="card"><div class="hd"><span class="fn">'+esc(file.name)+'</span><span class="badge '+all+'">'+(all==='ok'?'Passed':all==='warn'?'Please check':'Failed')+'</span></div>'
    +res.rows.map(r=>rowH(r)).join('')
    +rowH({label:'Signatories',status:sgS,msg:res.sg.filter(s=>s.status==='ok').length+' of '+res.sg.length+' complete'})
    +res.sg.map(s=>rowH(s,1)).join('')
    +'<div class="rm"><b>Remark</b><textarea readonly>'+esc(rem)+'</textarea><button class="cp">Copy remark</button></div>'
    +(ocrDead?'<div class="note">Some names are pictures and could not be read automatically here. Those are marked “Please check” so you can confirm them yourself.</div>':'')
    +'</div>';
}
async function run(files){
  const cfg=CFG[mode],out=$('#out');out.innerHTML='';
  for(const f of files){
    const slot=document.createElement('div');slot.className='card busy';slot.textContent='Checking '+f.name+' ... this can take a few seconds.';out.appendChild(slot);
    try{
      const res=await analyze(f,cfg);
      slot.outerHTML=card(f,cfg,res);
    }catch(e){slot.className='card note';slot.textContent='Could not read '+f.name+'. Please make sure it is a PDF file.'}
  }
}
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===m));$('#crit').textContent=CFG[m].crit;$('#out').innerHTML=''}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.m));
$('#f').onchange=e=>{if(e.target.files.length)run([...e.target.files]);e.target.value=''};
const dz=$('#drop');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');const fs=[...e.dataTransfer.files].filter(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));if(fs.length)run(fs)};
document.addEventListener('click',e=>{if(e.target.classList.contains('cp')){const ta=e.target.previousElementSibling;ta.select();try{navigator.clipboard.writeText(ta.value)}catch(_){document.execCommand('copy')}e.target.textContent='Copied'}});
setMode('spac');
</script>
</body></html>
